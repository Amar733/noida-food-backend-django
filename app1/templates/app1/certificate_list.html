{% extends 'app1/base.html' %}

{% block content %}
<h2>Certificates</h2>
<a href="{% url 'certificate_create' %}">Add New</a>
<ul>
    {% for cert in certificates %}
    <li>{{ cert.name }} - {{ cert.course }} ({{ cert.issue_date }})</li>
    {% empty %}
    <li>No certificates found.</li>
    {% endfor %}
</ul>
{% endblock %}
